services:
  # MySQL 8.x Database
  mysql:
    image: mysql:8.0
    container_name: careconnect_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: careconnect_db
      MYSQL_USER: careconnect_user
      MYSQL_PASSWORD: careconnect_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and BullMQ Job Queues
  redis:
    image: redis:7-alpine
    container_name: careconnect_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Express.js Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careconnect_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://careconnect_user:careconnect_pass@mysql:3306/careconnect_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "careconnect_jwt_access_secret_production_2026"
      JWT_REFRESH_SECRET: "careconnect_jwt_refresh_secret_production_2026"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
    ports:
      - "5000:5000"

  # Next.js Frontend Client App
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: careconnect_client
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost/api/v1"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost"
    depends_on:
      - server
    ports:
      - "3000:3000"

  # Nginx Reverse Proxy (Port 80)
  nginx:
    image: nginx:alpine
    container_name: careconnect_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server

volumes:
  mysql_data:
  redis_data:
  server_uploads:
